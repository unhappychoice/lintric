[package]
name = "lintric-cli"
description = "Command-line interface for Lintric, a line-level dependency metrics tool"
readme = "README.md"
keywords = ["metrics", "static-analysis", "cli", "complexity"]
categories = ["command-line-utilities", "development-tools"]
version.workspace = true
edition.workspace = true
repository.workspace = true

[dependencies]
lintric-core = { path = "../core" }
clap = { version = "4.6.1", features = ["derive"] }
comfy-table = "8.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
syntect = "5.3.0"
tera = "2.0.0"

[dev-dependencies]
insta = "1.47.2"
