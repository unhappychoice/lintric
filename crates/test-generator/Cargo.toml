[package]
name = "lintric-test-generator"
description = "Generates per-node-type analysis tests from tree-sitter node type definitions"
publish = false
version.workspace = true
edition.workspace = true
repository.workspace = true

[dependencies]
lintric-core = { path = "../core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
insta = "1.47.2"

[[bin]]
name = "test_generator"
path = "src/bin/test_generator.rs"

[[test]]
name = "generated_tests"
path = "tests/mod.rs"
