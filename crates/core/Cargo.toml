[package]
name = "lintric-core"
description = "Code metrics derived from line-level dependencies in source code"
readme = "README.md"
keywords = ["metrics", "static-analysis", "tree-sitter", "complexity"]
categories = ["development-tools"]
version.workspace = true
edition.workspace = true
repository.workspace = true

[dependencies]
petgraph = "0.8.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tree-sitter = "0.27.0"
tree-sitter-rust = "0.24.2"
tree-sitter-typescript = "0.23.2"
streaming-iterator = "0.1"

[dev-dependencies]
insta = "1.47.2"

[[test]]
name = "integration_tests"
path = "tests/mod.rs"

